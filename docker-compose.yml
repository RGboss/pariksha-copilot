name: pariksha-copilot

services:
  # ==============================================================
  # Database Service: PostgreSQL 16 (Optional production RDBMS)
  # ==============================================================
  db:
    image: postgres:16-alpine
    container_name: pariksha_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pariksha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pariksha_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-pariksha_copilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pariksha_user} -d ${POSTGRES_DB:-pariksha_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pariksha-copilot-net

  # ==============================================================
  # Backend Service: FastAPI + ChromaDB + Google GenAI + PyMuPDF
  # ==============================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pariksha_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/gov_exam_portal.db}
      - CHROMA_PERSIST_DIR=${CHROMA_PERSIST_DIR:-/app/data/chroma_db}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/data/uploads}
      - DATA_DIR=/app/data
    volumes:
      - sqlite_data:/app/data
      - chroma_data:/app/data/chroma_db
      - uploads_data:/app/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - pariksha-copilot-net

  # ==============================================================
  # Frontend & Reverse Proxy: Nginx + React SPA
  # ==============================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pariksha_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-8082}:80"
    networks:
      - pariksha-copilot-net

volumes:
  sqlite_data:
    name: pariksha_sqlite_data
  chroma_data:
    name: pariksha_chroma_data
  uploads_data:
    name: pariksha_uploads_data
  postgres_data:
    name: pariksha_postgres_data

networks:
  pariksha-copilot-net:
    name: pariksha-copilot-net
    driver: bridge
